<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOKOHAMA FUTURES - 試合動画</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #8b0000, #1a1a1a);
      padding: 24px 20px;
      text-align: center;
      border-bottom: 3px solid #c8a84b;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }

    header h1 span {
      color: #c8a84b;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #ccc;
    }

    #status {
      text-align: center;
      padding: 40px 20px;
      color: #aaa;
      font-size: 0.95rem;
    }

    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 30px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #2a1a1a;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-thumb .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      transition: background 0.2s;
    }

    .card:hover .play-icon {
      background: rgba(0,0,0,0.35);
    }

    .play-icon svg {
      width: 52px;
      height: 52px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .play-icon svg {
      opacity: 1;
    }

    .card-body {
      padding: 14px 16px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-date {
      font-size: 0.78rem;
      color: #c8a84b;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.72rem;
      background: #8b0000;
      color: #fff;
      border-radius: 4px;
      padding: 2px 8px;
    }

    .card-result {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 4px;
      padding: 2px 10px;
    }

    .card-result.win  { background: #1a5c2a; color: #6dff8f; }
    .card-result.lose { background: #5c1a1a; color: #ff6d6d; }
    .card-result.draw { background: #3a3a3a; color: #ccc; }

    .filter-section {
      padding: 16px 20px 0;
      max-width: 1200px;
      margin: 0 auto;
    }

    .filter-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: #2a1a1a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .filter-btn:hover {
      border-color: #c8a84b;
      color: #c8a84b;
    }

    .filter-btn.active {
      background: #8b0000;
      border-color: #8b0000;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #555;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      #video-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 16px 12px;
      }
      header h1 {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 380px) {
      #video-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>⚾ YOKOHAMA <span>FUTURES</span></h1>
  <p>試合・練習動画アーカイブ</p>
</header>

<div id="status">動画を読み込み中...</div>
<div class="filter-section">
  <div class="filter-label">シーズン</div>
  <div id="season-bar"></div>
</div>
<div class="filter-section">
  <div class="filter-label">大会</div>
  <div id="filter-bar"></div>
</div>
<div id="video-grid"></div>

<footer>
  <p>YOKOHAMA FUTURES © 2026</p>
</footer>

<script>
  const statusEl    = document.getElementById('status');
  const gridEl      = document.getElementById('video-grid');
  const filterBarEl = document.getElementById('filter-bar');
  const seasonBarEl = document.getElementById('season-bar');

  let allItems     = [];
  let activeSeason = 'すべて';
  let activeTag    = 'すべて';

  async function fetchVideos() {
    try {
      const res = await fetch('videos.json');
      allItems = await res.json();

      if (!allItems || allItems.length === 0) {
        statusEl.textContent = '動画が登録されていません。';
        return;
      }

      statusEl.style.display = 'none';
      renderFilterButtons();
      applyFilters();

    } catch (err) {
      statusEl.textContent = '動画の読み込みに失敗しました。';
      console.error(err);
    }
  }

  function applyFilters() {
    gridEl.innerHTML = '';
    const filtered = allItems.filter(i => {
      const seasonMatch = activeSeason === 'すべて' || String(i.season) === String(activeSeason);
      const tagMatch    = activeTag    === 'すべて' || i.tag === activeTag;
      return seasonMatch && tagMatch;
    });
    renderCards(filtered);
  }

  function makeButtons(container, values, getActive, setActive) {
    container.innerHTML = '';
    values.forEach(val => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (val === getActive() ? ' active' : '');
      btn.textContent = val;
      btn.addEventListener('click', () => {
        setActive(val);
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilters();
      });
      container.appendChild(btn);
    });
  }

  function renderFilterButtons() {
    const seasons = ['すべて', ...new Set(allItems.map(i => i.season).filter(Boolean)).values()].sort((a, b) => b - a);
    const tags    = ['すべて', ...new Set(allItems.map(i => i.tag).filter(Boolean))];

    makeButtons(seasonBarEl, seasons, () => activeSeason, v => activeSeason = v);
    makeButtons(filterBarEl, tags,    () => activeTag,    v => activeTag    = v);
  }

  function renderCards(items) {
    items.forEach(item => {
      const videoId = item.id;
      const title   = item.title;
      const thumb   = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      const date    = new Date(item.date).toLocaleDateString('ja-JP', {
        year: 'numeric', month: 'long', day: 'numeric'
      });
      const tagHtml = item.tag ? `<div class="card-tag">${item.tag}</div>` : '';

      let resultHtml = '';
      if (item.result === '勝') {
        resultHtml = `<div class="card-result win">勝</div>`;
      } else if (item.result === '負') {
        resultHtml = `<div class="card-result lose">負</div>`;
      } else if (item.result === '分') {
        resultHtml = `<div class="card-result draw">分</div>`;
      }

      const card = document.createElement('a');
      card.className = 'card';
      card.href = `https://www.youtube.com/watch?v=${videoId}`;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      card.innerHTML = `
        <div class="card-thumb">
          <img src="${thumb}" alt="${title}" loading="lazy" />
          <div class="play-icon">
            <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="34" cy="34" r="34" fill="rgba(255,255,255,0.9)"/>
              <polygon points="27,20 54,34 27,48" fill="#c8a84b"/>
            </svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">${tagHtml}${resultHtml}</div>
          <div class="card-title">${title}</div>
          <div class="card-date">${date}</div>
        </div>
      `;

      gridEl.appendChild(card);
    });
  }

  fetchVideos();
</script>

</body>
</html>
