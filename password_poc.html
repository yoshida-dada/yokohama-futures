<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOKOHAMA FUTURES</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── パスワード画面 ── */
    #pw-screen {
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
    }

    #pw-screen .logo-block {
      text-align: center;
      margin-bottom: 40px;
    }

    #pw-screen .logo-block .badge {
      display: inline-block;
      background: linear-gradient(135deg, #8b0000, #3a0000);
      border: 2px solid #c8a84b;
      border-radius: 50%;
      width: 96px;
      height: 96px;
      line-height: 96px;
      font-size: 2.2rem;
      margin-bottom: 16px;
    }

    #pw-screen .logo-block h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #fff;
    }

    #pw-screen .logo-block p {
      font-size: 0.75rem;
      color: #c8a84b;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    #pw-screen .card {
      background: #242424;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
    }

    #pw-screen .card label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    #pw-screen .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    #pw-screen .input-wrap input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }

    #pw-screen .input-wrap input:focus {
      border-color: #c8a84b;
    }

    #pw-screen .input-wrap input.error {
      border-color: #e05c5c;
    }

    /* 目アイコン（パスワード表示切替） */
    #pw-screen .toggle-vis {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: #888;
      padding: 4px;
      line-height: 1;
    }

    #pw-screen .error-msg {
      font-size: 0.8rem;
      color: #e05c5c;
      min-height: 18px;
      margin-bottom: 16px;
    }

    #pw-screen .btn-enter {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b0000, #c00000);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    #pw-screen .btn-enter:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    #pw-screen .gold-line {
      width: 40px;
      height: 3px;
      background: #c8a84b;
      border-radius: 2px;
      margin: 24px auto 0;
    }

    /* ── 本体（ダミー）── */
    #main-content {
      display: none;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }

    #main-content h2 {
      font-size: 1.4rem;
      color: #c8a84b;
      margin-bottom: 12px;
    }

    #main-content p {
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<!-- ▼ パスワード画面 -->
<div id="pw-screen">
  <div class="logo-block">
    <div class="badge">⚾</div>
    <h1>YOKOHAMA FUTURES</h1>
    <p>MEMBERS ONLY</p>
  </div>

  <div class="card">
    <label>パスワードを入力してください</label>
    <div class="input-wrap">
      <input type="password" id="pw-input" placeholder="password"
             autocomplete="current-password" />
      <button class="toggle-vis" id="toggle-vis" type="button" aria-label="パスワードを表示">👁</button>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <button class="btn-enter" id="btn-enter">ENTER</button>
    <div class="gold-line"></div>
  </div>
</div>

<!-- ▼ 本体（PoC用ダミー） -->
<div id="main-content">
  <h2>ログイン成功！</h2>
  <p>ここに本来のページが表示されます。</p>
</div>

<script>
  const CORRECT = 'futures';

  const pwInput  = document.getElementById('pw-input');
  const btnEnter = document.getElementById('btn-enter');
  const errorMsg = document.getElementById('error-msg');
  const toggleVis = document.getElementById('toggle-vis');

  function tryLogin() {
    if (pwInput.value === CORRECT) {
      document.getElementById('pw-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
    } else {
      pwInput.classList.add('error');
      errorMsg.textContent = 'パスワードが違います';
      pwInput.value = '';
      pwInput.focus();
      setTimeout(() => {
        pwInput.classList.remove('error');
        errorMsg.textContent = '';
      }, 2000);
    }
  }

  btnEnter.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  toggleVis.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    toggleVis.textContent = isHidden ? '🙈' : '👁';
  });

  // 自動フォーカス
  pwInput.focus();
</script>
</body>
</html>
